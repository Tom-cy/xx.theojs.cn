# 官网 HTTPS 配置。首次签发证书前，先使用 deploy/www-http.conf。
# 默认官网域名：www.iskaola.com；运营端 hair.conf 保持独立。
server {
    listen 80;
    server_name www.iskaola.com;

    # 独立验证目录不随 prod.sh 的版本切换而改变。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://www.iskaola.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.iskaola.com;

    ssl_certificate /etc/letsencrypt/live/www.iskaola.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.iskaola.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:WWW_SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/hair/www;
    index index.html;
    charset utf-8;

    # VitePress 是静态多页面站点，不将缺失路径回退为首页。
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # VitePress /assets/ 下的文件名包含内容哈希。
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # public/ 内的图片文件名固定，使用较短缓存。
    location /images/ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
    }

    location ~ /\. {
        deny all;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }
}
