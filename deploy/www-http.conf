# 首次申请证书专用。安装为 /etc/nginx/conf.d/www.conf。
# 证书签发后，用项目根目录的 www.conf 替换同一文件。
server {
    listen 80;
    server_name www.iskaola.com;
    root /var/www/hair/www;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
